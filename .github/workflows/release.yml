name: Release macOS

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22.14.0
  PNPM_VERSION: 8.15.0
  RUST_VERSION: 1.97.1
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build, sign, and notarize universal macOS app
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify tag signature and ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git tag -v "$RELEASE_TAG" 2>/dev/null || {
            echo "::warning title=Unsigned tag::Tag $RELEASE_TAG is not signed or the signing key is not in the runner's GPG keyring. Import the maintainer's public key with 'gpg --import' before release, or tag with 'git tag -s' and ensure the key is trusted."
          }
          if ! git branch --contains "$RELEASE_TAG" | grep -qE '^\*?\s+main$'; then
            echo "::error title=Tag not on main::Tag $RELEASE_TAG is not an ancestor of the main branch"
            exit 1
          fi
          echo "Tag $RELEASE_TAG is valid and on main."

      - name: Validate release secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          TAURI_JIRA_CLIENT_ID: ${{ vars.TAURI_JIRA_CLIENT_ID }}
          TAURI_LINEAR_CLIENT_ID: ${{ vars.TAURI_LINEAR_CLIENT_ID }}
        run: |
          set -euo pipefail
          required=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            KEYCHAIN_PASSWORD
            APPLE_ID
            APPLE_PASSWORD
            APPLE_TEAM_ID
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            TAURI_JIRA_CLIENT_ID
            TAURI_LINEAR_CLIENT_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing release secret::${name} is required"
              exit 1
            fi
          done

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-16
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt,clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: apps/agent/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const expected = process.env.RELEASE_TAG.replace(/^v/, "");
          const versions = {
            "package.json": JSON.parse(fs.readFileSync("package.json", "utf8")).version,
            "apps/agent/package.json": JSON.parse(fs.readFileSync("apps/agent/package.json", "utf8")).version,
            "apps/agent/src-tauri/tauri.conf.json": JSON.parse(fs.readFileSync("apps/agent/src-tauri/tauri.conf.json", "utf8")).version,
          };
          const cargo = fs.readFileSync("apps/agent/src-tauri/Cargo.toml", "utf8");
          versions["apps/agent/src-tauri/Cargo.toml"] = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          for (const [file, version] of Object.entries(versions)) {
            if (version !== expected) throw new Error(`${file} is ${version}; tag is ${expected}`);
          }
          console.log(`Release version ${expected} is consistent.`);
          NODE

      - name: Run frontend and Rust quality gates
        run: |
          pnpm check:frontend
          cargo fmt --manifest-path apps/agent/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path apps/agent/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path apps/agent/src-tauri/Cargo.toml --lib
          node --check scripts/fetch-models.mjs

      - name: Download and verify model assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-models.mjs

      - name: Import Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/flowmates-developer-id.p12"
          keychain_path="$RUNNER_TEMP/flowmates-signing.keychain-db"
          login_keychain="$(security default-keychain -d user | tr -d '"')"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "$login_keychain"

          identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "::error title=Signing identity missing::The certificate does not contain a Developer ID Application identity"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build universal macOS bundle
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          TAURI_JIRA_CLIENT_ID: ${{ vars.TAURI_JIRA_CLIENT_ID }}
          TAURI_LINEAR_CLIENT_ID: ${{ vars.TAURI_LINEAR_CLIENT_ID }}
        run: pnpm tauri build --target universal-apple-darwin

      - name: Verify architecture, signature, and notarization
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="apps/agent/src-tauri/target/universal-apple-darwin/release/bundle"
          app_bundle="$(find "$bundle_root/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_bundle" ]]; then
            echo "::error title=Bundle missing::No .app bundle was produced"
            exit 1
          fi

          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_bundle/Contents/Info.plist")"
          app_binary="$app_bundle/Contents/MacOS/$executable"
          llama_binary="$app_bundle/Contents/MacOS/llama-server"
          if [[ ! -f "$llama_binary" ]]; then
            echo "::error title=Sidecar missing::Bundled llama-server was not found"
            exit 1
          fi

          lipo "$app_binary" -verify_arch arm64 x86_64
          lipo "$llama_binary" -verify_arch arm64 x86_64
          codesign --verify --strict --verbose=2 "$llama_binary"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          xcrun stapler validate "$app_bundle"
          spctl --assess --type execute --verbose=2 "$app_bundle"

      - name: Verify DMG signature and notarization
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="apps/agent/src-tauri/target/universal-apple-darwin/release/bundle"
          dmg="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" || ! -f "$dmg" ]]; then
            echo "::error title=DMG missing::No .dmg was produced"
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          echo "DMG signature and notarization verified."

      - name: Prepare release artifacts and updater manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          bundle_root="apps/agent/src-tauri/target/universal-apple-darwin/release/bundle"
          dmg="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          archive="$(find "$bundle_root/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          signature="${archive}.sig"

          for path in "$dmg" "$archive" "$signature"; do
            if [[ -z "$path" || ! -f "$path" ]]; then
              echo "::error title=Artifact missing::Expected release artifact not found: $path"
              exit 1
            fi
          done

          mkdir -p release-assets
          dmg_name="Flowmates-Agent_${version}_universal.dmg"
          archive_name="Flowmates-Agent_${version}_universal.app.tar.gz"
          signature_name="${archive_name}.sig"
          cp "$dmg" "release-assets/$dmg_name"
          cp "$archive" "release-assets/$archive_name"
          cp "$signature" "release-assets/$signature_name"

          VERSION="$version" \
          ARCHIVE_NAME="$archive_name" \
          SIGNATURE_PATH="release-assets/$signature_name" \
          REPOSITORY="$REPOSITORY" \
          RELEASE_TAG="$RELEASE_TAG" \
          node <<'NODE'
          const fs = require("node:fs");
          const encodedTag = encodeURIComponent(process.env.RELEASE_TAG);
          const encodedAsset = encodeURIComponent(process.env.ARCHIVE_NAME);
          const url = `https://github.com/${process.env.REPOSITORY}/releases/download/${encodedTag}/${encodedAsset}`;
          const entry = {
            signature: fs.readFileSync(process.env.SIGNATURE_PATH, "utf8").trim(),
            url,
          };
          const manifest = {
            version: process.env.VERSION,
            notes: `Flowmates ${process.env.VERSION}`,
            pub_date: new Date().toISOString(),
            platforms: {
              "darwin-aarch64": entry,
              "darwin-x86_64": entry,
            },
          };
          fs.writeFileSync("release-assets/latest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-universal-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/flowmates-developer-id.p12"

  publish-release:
    name: Publish GitHub release
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-universal-release
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
