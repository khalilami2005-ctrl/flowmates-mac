[package]
name = "app"
version = "1.0.0"
description = "Activity measurement for macOS, analysed by a local vision model"
authors = ["Amine <khalilami2005@gmail.com>"]
repository = "https://github.com/khalilami2005-ctrl/flowmates-mac"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dev-dependencies]
temp-env = "0.3"
tempfile = "3"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = [] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
base64 = "0.22"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "blocking"] }
image = "0.25"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
active-win-pos-rs = "0.8"
oauth2 = "4.4"
url = "2.5"
tiny_http = "0.12"
open = "5.0"
dotenv = "0.15"
urlencoding = "2.1"
uuid = { version = "1", features = ["v4"] }
core-graphics = "0.25"
security-framework = "3.7"
